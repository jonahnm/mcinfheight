name: Release

# Creates a GitHub Release from a tag, e.g. `git tag v1.0.0 && git push origin v1.0.0`.
# The tag must match `mod_version` in gradle.properties.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tag
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${{ inputs.tag }}"
          fi
          git fetch --tags --force
          git checkout --force "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Verify tag matches mod_version
        run: |
          TAG="${{ steps.rel.outputs.tag }}"
          VERSION="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          echo "tag=$TAG mod_version=$VERSION"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match mod_version '$VERSION' (expected v$VERSION)"
            exit 1
          fi

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build

      - name: Locate mod jar
        id: jar
        run: |
          JAR="$(ls build/libs/*.jar 2>/dev/null | grep -v -- '-sources\|-javadoc' | head -1)"
          if [ -z "$JAR" ]; then
            echo "::error::No mod jar produced in build/libs"
            ls -l build/libs || true
            exit 1
          fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Found $JAR"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.rel.outputs.tag }}"
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease";; esac
          gh release create "$TAG" \
            "${{ steps.jar.outputs.path }}" \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE